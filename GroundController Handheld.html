document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

osition:absolute;inset:0;background:repeating-linear-gradient(45deg,#0c100e,#0c100e 7px,#0a0d0b 7px,#0a0d0b 14px)\"><\u002Fdiv>\n         <div style=\"position:absolute;top:5px;left:6px;display:flex;align-items:center;gap:3px;font-family:'JetBrains Mono',monospace;font-size:7px;color:#ff6b6b\"><span style=\"width:5px;height:5px;border-radius:50%;background:#ff4d4d\"><\u002Fspan>REC<\u002Fdiv>\n         <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border:1px solid rgba(255,59,59,.7)\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ pip.isHud }}\" hint-placeholder-val=\"{{ false }}\">\n         <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,#1d5478 0%,#1d5478 49.5%,#c99a55 50.5%,#6e4a1f 100%)\"><\u002Fdiv>\n         <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:2px;background:#ff3b3b;box-shadow:0 0 6px #ff3b3b\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.85))\">\n         <span style=\"font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;color:#e9e7ee\">{{ pip.label }}<\u002Fspan>\n         <span style=\"font-size:7px;color:#ff3b3b;font-family:'JetBrains Mono',monospace;letter-spacing:.06em\">TAP ▸<\u002Fspan>\n        <\u002Fdiv>\n       <\u002Fdiv>\n      <\u002Fsc-for>\n     <\u002Fdiv>\n\n     <div style=\"position:absolute;inset:0;pointer-events:none;z-index:45;background:linear-gradient(rgba(255,255,255,.018),transparent 3px);background-size:100% 3px;opacity:.5\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- FLIGHT MODE RAIL -->\n    <div style=\"width:134px;flex:none;background:#0b0e0c;border-left:1px solid #1a211d;display:flex;flex-direction:column;padding:8px 8px 8px 9px\">\n     <div style=\"font-size:9px;letter-spacing:.18em;color:#6f6d7a;margin-bottom:7px;font-weight:600\">FLIGHT MODE<\u002Fdiv>\n     <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n      <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"6\">\n       <button onclick=\"{{ m.onClick }}\" style=\"{{ m.style }}\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:.03em\">{{ m.name }}<\u002Fspan>\n        <span style=\"font-size:8px;opacity:.72;letter-spacing:.02em\">{{ m.desc }}<\u002Fspan>\n       <\u002Fbutton>\n      <\u002Fsc-for>\n     <\u002Fdiv>\n    <\u002Fdiv>\n   <\u002Fdiv>\n\n   <!-- ============ TELEMETRY STRIP ============ -->\n   <div style=\"height:80px;flex:none;display:grid;grid-template-columns:repeat(7,1fr);background:#0b0e0c;border-top:1px solid #1a211d\">\n    <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"7\">\n     <div style=\"display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 11px;border-right:1px solid #161c19\">\n      <div style=\"font-size:8px;letter-spacing:.14em;color:#6f6d7a;font-family:'Chakra Petch',sans-serif;font-weight:600\">{{ t.label }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:3px\">\n       <span style=\"{{ t.valStyle }}\">{{ t.value }}<\u002Fspan>\n       <span style=\"font-size:9px;color:#7d7b88;font-family:'JetBrains Mono',monospace\">{{ t.unit }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:8px;color:#8a8894;font-family:'JetBrains Mono',monospace;letter-spacing:.03em\">{{ t.sub }}<\u002Fdiv>\n     <\u002Fdiv>\n    <\u002Fsc-for>\n   <\u002Fdiv>\n\n  <\u002Fdiv>\n <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    scale: 1, mainView: 'MAP', mode: 'LOITER', armed: true,\n    t: 372,\n    battV: 24.6, battPct: 78, battA: 17.9,\n    alt: 42.6, altAbs: 118.4, spdG: 6.2, spdA: 7.0,\n    hdg: 47, sats: 17, fix: '3D RTK', rf: 92, dist: 214,\n    pitch: 2.4, roll: -5,\n    drone: { x: 52, y: 50 }, goto: null, guided: false,\n  };\n  waypoints = [ {x:18,y:80},{x:34,y:58},{x:55,y:42},{x:72,y:52},{x:60,y:70} ];\n  home = { x: 18, y: 80 };\n\n  componentDidMount(){\n    this.fit();\n    this._r = () => this.fit();\n    window.addEventListener('resize', this._r);\n    this._iv = setInterval(() => this.tick(), 400);\n  }\n  componentWillUnmount(){ window.removeEventListener('resize', this._r); clearInterval(this._iv); }\n\n  fit(){\n    const s = Math.min(window.innerWidth / 800, window.innerHeight / 480);\n    this.setState({ scale: Math.max(0.2, s) });\n  }\n\n  tick(){\n    this.setState(s => {\n      const n = { ...s };\n      const j = (v, a) => v + (Math.random() - 0.5) * a;\n      if (s.armed) {\n        n.t = s.t + 0.4;\n        n.battPct = Math.max(2, s.battPct - 0.018);\n        n.battV = 22 + (n.battPct / 100) * 3.3 + (Math.random() - 0.5) * 0.05;\n        n.battA = Math.max(2, j(s.battA, 1.4));\n      }\n      n.alt = Math.max(0, j(s.alt, 0.55));\n      n.altAbs = 76 + n.alt;\n      n.spdG = Math.max(0, j(s.spdG, 0.45));\n      n.spdA = Math.max(0, n.spdG + 0.6 + (Math.random() - 0.5) * 0.4);\n      n.rf = Math.max(24, Math.min(100, j(s.rf, 3)));\n      n.sats = Math.max(9, Math.min(22, Math.round(j(s.sats, 0.35))));\n      n.pitch = j(s.pitch, 1.1) * 0.9;\n      n.roll = Math.max(-28, Math.min(28, j(s.roll, 2.6) * 0.94));\n      if (s.guided && s.goto) {\n        const dx = s.goto.x - s.drone.x, dy = s.goto.y - s.drone.y;\n        const d = Math.hypot(dx, dy);\n        n.hdg = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;\n        if (d > 0.7) {\n          const step = Math.min(d, 0.85);\n          n.drone = { x: s.drone.x + dx / d * step, y: s.drone.y + dy / d * step };\n        } else {\n          n.guided = false; n.goto = null; n.mode = 'LOITER';\n        }\n      } else {\n        n.hdg = (s.hdg + (Math.random() - 0.4) * 2 + 360) % 360;\n      }\n      const hx = this.home.x - n.drone.x, hy = this.home.y - n.drone.y;\n      n.dist = Math.round(Math.hypot(hx, hy) * 7.4);\n      return n;\n    });\n  }\n\n  setMain = (v) => this.setState({ mainView: v });\n  toggleArm = () => this.setState(s => ({ armed: !s.armed }));\n  setMode = (m) => this.setState(() => {\n    const st = { mode: m, guided: false };\n    if (m === 'TAKEOFF') st.armed = true;\n    return st;\n  });\n  onMapClick = (e) => {\n    const r = e.currentTarget.getBoundingClientRect();\n    const x = ((e.clientX - r.left) / r.width) * 100;\n    const y = ((e.clientY - r.top) / r.height) * 100;\n    this.setState({ goto: { x: Math.max(3, Math.min(97, x)), y: Math.max(3, Math.min(97, y)) }, guided: false });\n  };\n  confirmGoto = (e) => { if (e) e.stopPropagation(); this.setState({ guided: true, armed: true, mode: 'GUIDED' }); };\n  cancelGoto = (e) => { if (e) e.stopPropagation(); this.setState({ goto: null, guided: false }); };\n\n  renderVals(){\n    const s = this.state;\n    const pad = (n) => String(n).padStart(2, '0');\n    const clock = pad(Math.floor(s.t / 60)) + ':' + pad(Math.floor(s.t % 60));\n    const card = (h) => ['N','NE','E','SE','S','SW','W','NW'][Math.round((((h % 360) + 360) % 360) / 45) % 8];\n    const modeLabel = s.guided ? 'GUIDED' : s.mode;\n    const modeColor = s.guided ? '#ff3b3b' : (s.mode === 'LAND' ? '#ffb020' : '#37e0a0');\n    const modeNameStyle = { fontFamily: \"'JetBrains Mono',monospace\", fontWeight: '700', fontSize: '14px', color: modeColor, letterSpacing: '.04em' };\n\n    const isMap = s.mainView === 'MAP', isCam = s.mainView === 'CAM', isHud = s.mainView === 'HUD';\n    const meta = { MAP: 'TAC MAP', CAM: 'FPV CAM', HUD: 'PFD HUD' };\n    const pips = ['MAP','CAM','HUD'].filter(v => v !== s.mainView).map(v => ({\n      type: v, isMap: v === 'MAP', isCam: v === 'CAM', isHud: v === 'HUD',\n      label: meta[v],\n      onClick: (e) => { if (e) e.stopPropagation(); this.setMain(v); },\n    }));\n\n    const bs = (a) => ({\n      height: '0', flex: '1 1 0', minHeight: '0', display: 'flex', flexDirection: 'column',\n      alignItems: 'flex-start', justifyContent: 'center', gap: '1px', padding: '0 10px', cursor: 'pointer',\n      border: '1px solid ' + (a ? '#ff3b3b' : '#20281f'),\n      background: a ? 'linear-gradient(90deg,rgba(255,59,59,.26),rgba(255,59,59,.04))' : '#0e1210',\n      color: a ? '#ffe9e9' : '#b9b7c2', borderRadius: '6px',\n      boxShadow: a ? '0 0 12px rgba(255,59,59,.2)' : 'none',\n      fontFamily: \"'JetBrains Mono',monospace\", textAlign: 'left', width: '100%', outline: 'none',\n    });\n    const md = [['TAKEOFF','auto climb'],['STAB','manual'],['ALT HOLD','hold alt'],['LOITER','hold pos'],['LAND','auto descend'],['AUTO','run mission']];\n    const modes = md.map(([name, desc]) => {\n      const active = !s.guided && s.mode === name;\n      return { name, desc, style: bs(active), onClick: () => this.setMode(name) };\n    });\n\n    const armed = s.armed;\n    const armLabel = armed ? '● ARMED' : '○ DISARMED';\n    const armBtnStyle = {\n      display: 'flex', alignItems: 'center', gap: '5px', height: '22px', padding: '0 10px', cursor: 'pointer',\n      borderRadius: '5px', fontFamily: \"'JetBrains Mono',monospace\", fontWeight: '700', fontSize: '11px',\n      letterSpacing: '.06em', outline: 'none',\n      border: '1px solid ' + (armed ? 'rgba(255,77,77,.6)' : 'rgba(55,224,160,.5)'),\n      color: armed ? '#ff6b6b' : '#37e0a0',\n      background: armed ? 'rgba(255,77,77,.12)' : 'rgba(55,224,160,.1)',\n    };\n\n    const battColor = s.battPct > 50 ? '#37e0a0' : (s.battPct > 22 ? '#ffb020' : '#ff4d4d');\n    const battMiniFill = { height: '100%', width: s.battPct + '%', background: battColor, borderRadius: '1px' };\n    const tv = (c) => ({ fontFamily: \"'JetBrains Mono',monospace\", fontWeight: '700', fontSize: '20px', lineHeight: '1', color: c });\n    const tiles = [\n      { label: 'GND SPD', value: s.spdG.toFixed(1), unit: 'm/s', sub: 'AIR ' + s.spdA.toFixed(1), valStyle: tv('#e9e7ee') },\n      { label: 'ALT REL', value: s.alt.toFixed(1), unit: 'm', sub: 'ABS ' + s.altAbs.toFixed(0) + 'm', valStyle: tv('#e9e7ee') },\n      { label: 'DIST HOME', value: String(s.dist), unit: 'm', sub: 'RTL READY', valStyle: tv('#e9e7ee') },\n      { label: 'HEADING', value: s.hdg.toFixed(0) + '°', unit: '', sub: card(s.hdg), valStyle: tv('#e9e7ee') },\n      { label: 'GPS', value: String(s.sats), unit: 'sat', sub: s.fix, valStyle: tv('#37e0a0') },\n      { label: 'RF LINK', value: s.rf.toFixed(0) + '%', unit: '', sub: s.rf > 75 ? 'STRONG' : (s.rf > 45 ? 'NOMINAL' : 'WEAK'), valStyle: tv(s.rf > 45 ? '#e9e7ee' : '#ffb020') },\n      { label: 'BATTERY', value: s.battPct.toFixed(0) + '%', unit: '', sub: s.battV.toFixed(1) + 'V · ' + s.battA.toFixed(1) + 'A', valStyle: tv(battColor) },\n    ];\n\n    const droneStyle = { position: 'absolute', left: s.drone.x + '%', top: s.drone.y + '%', transform: 'translate(-50%,-50%)', zIndex: 16, pointerEvents: 'none' };\n    const droneRotate = { transform: 'rotate(' + s.hdg.toFixed(1) + 'deg)', transformOrigin: 'center', lineHeight: 0 };\n    const homeStyle = { position: 'absolute', left: this.home.x + '%', top: this.home.y + '%', transform: 'translate(-50%,-50%)', zIndex: 14, pointerEvents: 'none' };\n    const wpMarks = this.waypoints.map((w, i) => ({\n      n: String(i + 1),\n      style: { position: 'absolute', left: w.x + '%', top: w.y + '%', transform: 'translate(-50%,-50%)', width: '16px', height: '16px', borderRadius: '50%', border: '1px solid rgba(255,59,59,.8)', background: 'rgba(255,59,59,.14)', color: '#ffe9e9', fontSize: '9px', fontFamily: \"'JetBrains Mono',monospace\", display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 0 8px rgba(255,59,59,.3)', pointerEvents: 'none', zIndex: 13 },\n    }));\n    const pathPoints = this.waypoints.map(w => w.x + ',' + w.y).join(' ');\n    const gotoStyle = s.goto\n      ? { position: 'absolute', left: s.goto.x + '%', top: s.goto.y + '%', transform: 'translate(-50%,-50%)', zIndex: 18, pointerEvents: 'none' }\n      : { display: 'none' };\n    const needleStyle = { position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, transform: 'rotate(' + s.hdg.toFixed(1) + 'deg)', transformOrigin: 'center' };\n    const horizonStyle = { position: 'absolute', left: '-50%', top: '-100%', width: '200%', height: '300%', transform: 'translateY(' + (s.pitch * 4).toFixed(1) + 'px) rotate(' + s.roll.toFixed(1) + 'deg)', background: 'linear-gradient(180deg,#123a52 0%,#1d5478 49.5%,#c99a55 50.5%,#6e4a1f 100%)', pointerEvents: 'none' };\n\n    return {\n      deviceTransform: 'scale(' + s.scale + ')',\n      clock, modeLabel, modeNameStyle,\n      isMap, isCam, isHud, pips, modes,\n      armLabel, armBtnStyle, toggleArm: this.toggleArm,\n      tiles, droneStyle, droneRotate, homeStyle, wpMarks, pathPoints, gotoStyle, needleStyle, horizonStyle,\n      onMapClick: this.onMapClick, confirmGoto: this.confirmGoto, cancelGoto: this.cancelGoto,\n      gotoPending: !!s.goto && !s.guided, guided: s.guided,\n      battPct: s.battPct.toFixed(0) + '%', battMiniFill, sats: String(s.sats), fix: s.fix, rfPct: s.rf.toFixed(0) + '%',\n      alt: s.alt.toFixed(0), spd: s.spdG.toFixed(1), spdA: s.spdA.toFixed(1), hdgTxt: s.hdg.toFixed(0) + '°', card: card(s.hdg),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
